<rect x="0.5" y="0.5" width="879" height="727" rx="12" fill="none" stroke="#30363d"/>
<text x="24" y="38" font-size="17" fill="#e6edf3" font-family="Inter, system-ui, -apple-system, 'Segoe UI', sans-serif" font-weight="600" text-anchor="start">Every mutation takes the same path</text>
<rect x="24" y="50" width="42" height="3" rx="1.5" fill="#38bdf8"/>
<text x="24" y="84" font-size="10.5" fill="#38bdf8" font-weight="600" letter-spacing="0.09em" font-family="Inter, system-ui, -apple-system, 'Segoe UI', sans-serif">FOUR WAYS IN</text>
