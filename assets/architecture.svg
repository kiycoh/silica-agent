<text x="40" y="332" font-size="11" fill="#7d8590" font-family="Inter, system-ui, -apple-system, 'Segoe UI', sans-serif" font-weight="400" text-anchor="start">reads the vault and the payload</text>
<text x="240" y="332" font-size="11" fill="#adbac7" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-weight="400" text-anchor="start">RECON · PAYLOAD · SALIENCE · COLLISION</text>
<text x="40" y="354" font-size="11" fill="#7d8590" font-family="Inter, system-ui, -apple-system, 'Segoe UI', sans-serif" font-weight="400" text-anchor="start">decides what to write</text>
<text x="240" y="354" font-size="11" fill="#adbac7" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-weight="400" text-anchor="start">DELEGATE · SANITIZE · VALIDATE</text>
<text x="40" y="376" font-size="11" fill="#7d8590" font-family="Inter, system-ui, -apple-system, 'Segoe UI', sans-serif" font-weight="400" text-anchor="start">writes, then repairs the graph</text>
<text x="240" y="376" font-size="11" fill="#adbac7" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-weight="400" text-anchor="start">SNAPSHOT · WRITE · HUB_UPDATE · AUTOLINK · BACKLINK · LINT · CLEANUP</text>
<rect x="40" y="384" width="800" height="1" fill="#30363d"/>
<text x="40" y="403" font-size="11" fill="#f0883e" font-family="Inter, system-ui, -apple-system, 'Segoe UI', sans-serif" font-weight="400" text-anchor="start">any gate fails, ROLLBACK applies the inverse ops and restores the pre-write snapshot</text>
