<text x="251.0" y="134" font-size="10.5" fill="#7d8590" font-family="Inter, system-ui, -apple-system, 'Segoe UI', sans-serif" font-weight="400" text-anchor="start">web GUI, FastAPI and SSE</text>
<rect x="446.0" y="94" width="199.0" height="50" rx="10" fill="#161b22" stroke="#30363d" stroke-width="1"/>
<text x="462.0" y="118" font-size="12.5" fill="#e6edf3" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-weight="500" text-anchor="start">silica connect</text>
