<text x="673.0" y="134" font-size="10.5" fill="#7d8590" font-family="Inter, system-ui, -apple-system, 'Segoe UI', sans-serif" font-weight="400" text-anchor="start">memory for another agent</text>
<path d="M440.0 144 L440.0 168" stroke="#30363d" stroke-width="1.5"/><path d="M435.0 167 L440.0 175 L445.0 167 Z" fill="#30363d"/>
<text x="24" y="172" font-size="10.5" fill="#38bdf8" font-weight="600" letter-spacing="0.09em" font-family="Inter, system-ui, -apple-system, 'Segoe UI', sans-serif">WHAT CAN COME IN</text>
