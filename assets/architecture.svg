<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 728" width="880" height="728" role="img" aria-label="Four ways in, one gate, seven kernel lanes, two backends, and a vault of plain markdown beside a private index." font-family="Inter, system-ui, -apple-system, 'Segoe UI', sans-serif">
<title>What a change passes through</title>
<desc>A change enters through the terminal, the web GUI, the Obsidian plugin or the MCP server. External content stages in Inbox. Everything then passes the Injector FSM, whose states call the seven kernel lanes, and the ops it emits reach the vault through the filesystem backend or the Obsidian plugin.</desc>
