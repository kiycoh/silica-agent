<text x="40" y="206" font-size="12.5" fill="#adbac7" font-family="Inter, system-ui, -apple-system, 'Segoe UI', sans-serif" font-weight="400" text-anchor="start">prose · code · documents · notebooks · transcripts · web pages · web research</text>
<text x="40" y="226" font-size="10.5" fill="#7d8590" font-family="Inter, system-ui, -apple-system, 'Segoe UI', sans-serif" font-weight="400" text-anchor="start">external content normalizes into Inbox/ and reaches the vault only through the gate below</text>
<path d="M440.0 238 L440.0 268" stroke="#30363d" stroke-width="1.5"/><path d="M435.0 267 L440.0 275 L445.0 267 Z" fill="#30363d"/>
<text x="24" y="272" font-size="10.5" fill="#38bdf8" font-weight="600" letter-spacing="0.09em" font-family="Inter, system-ui, -apple-system, 'Segoe UI', sans-serif">THE GATE</text>
