# `docker compose run --rm cli` — the REPL, curating whatever is mounted at /vault
# `docker compose up gui`       — the web UI on http://localhost:8765

x-common: &common
  image: silica:local
  # Here and not on cli alone: cli sits behind a profile, and a plain
  # `docker compose build` skips profiled services.
  build: .
  # Host networking on purpose. The embedding (:1234), rerank (:1235) and ollama
  # (:11434) defaults all point at localhost because the servers run on this
  # machine, and the GUI binds 127.0.0.1 hardcoded (silica/ui/web/server.py) so
  # published ports would reach nothing. In bridge mode both need work: the URLs
  # move to host.docker.internal, and the bind needs a code change.
  network_mode: host
  volumes:
    # Named volume, not a bind mount: ledger.db, checkpoints.db and
    # undo_journal.db are SQLite, and its locking is unreliable over the
    # virtiofs/NFS layer a bind mount crosses on Docker Desktop.
    - silica-state:/data
    - ${SILICA_VAULT_HOST:-./vault}:/vault
  environment:
    # An exported key outranks ~/.silica/.env for good: silica/__init__.py
    # snapshots os.environ at package import (SHELL_ENV) and load_user_env skips
    # every name already in it, so these win over anything inside the volume.
    SILICA_MODEL: ${SILICA_MODEL:-openrouter/anthropic/claude-sonnet-4-20250514}
    OPENROUTER_API_KEY: ${OPENROUTER_API_KEY:-}
    ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
    OPENAI_API_KEY: ${OPENAI_API_KEY:-}
    # With the inference profile on a CPU host: one embedding batch takes
    # minutes, past the 60 s default (silica/config.py, embedding_timeout).
    SILICA_EMBEDDING_TIMEOUT: ${SILICA_EMBEDDING_TIMEOUT:-}
    # The model the inference profile's `embed` service serves. Without it the
    # config default (EmbeddingGemma 2) would apply its cosine bars to Qwen
    # vectors. Export your own when you run a different embedder.
    SILICA_EMBEDDING_MODEL: ${SILICA_EMBEDDING_MODEL:-text-embedding-qwen3-embedding-0.6b}

# Opt-in: `docker compose --profile inference up -d`. A local embedder and
# reranker, CPU only, for a host with no llama-server of its own. Same ports as
# silica's defaults, so they are found with no .env line. The chat model is not
# here: on a small CPU host an agent turn is a hosted API's job.
x-llama: &llama
  image: ghcr.io/ggml-org/llama.cpp:server
  profiles: [inference]
  network_mode: host
  restart: unless-stopped
  # -hf downloads the GGUF on first start; the volume keeps it across recreates.
  environment:
    LLAMA_CACHE: /models
  volumes:
    - llama-models:/models

services:
  embed:
    <<: *llama
    command: ["-hf", "Qwen/Qwen3-Embedding-0.6B-GGUF:Q8_0", "--embedding",
              "--pooling", "last", "-c", "8192", "--host", "127.0.0.1", "--port", "1234"]
    # The image's own HEALTHCHECK probes :8080, the port it was not given.
    healthcheck:
      test: ["CMD", "curl", "-fs", "http://127.0.0.1:1234/health"]
      interval: 30s
      start_period: 300s

  rerank:
    <<: *llama
    # -b/-ub 2048: a rerank pair is scored in ONE physical batch, and the
    # default ubatch of 512 answers 500 to any query+document past 512 tokens.
    command: ["-hf", "gpustack/bge-reranker-v2-m3-GGUF:Q8_0", "--reranking",
              "-c", "2048", "-b", "2048", "-ub", "2048", "--host", "127.0.0.1", "--port", "1235"]
    healthcheck:
      test: ["CMD", "curl", "-fs", "http://127.0.0.1:1235/health"]
      interval: 30s
      start_period: 300s

  cli:
    <<: *common
    # The REPL is a `run`, never a daemon: without a profile every `up -d`
    # also left one detached in the background (seen 2026-10-02). Naming the
    # service on `run` activates the profile, so `run --rm cli` is unchanged.
    profiles: [cli]
    stdin_open: true
    tty: true

  gui:
    <<: *common
    command: ["--gui"]
    restart: unless-stopped
    healthcheck:
      # No curl in python:slim, and installing one to check a health route is
      # the wrong trade — the interpreter is already there.
      test: ["CMD", "python", "-c",
             "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8765/health')"]
      interval: 30s
      timeout: 5s
      start_period: 20s

volumes:
  silica-state:
  llama-models:
