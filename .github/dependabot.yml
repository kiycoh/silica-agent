# Dependabot version updates.
# Two ecosystems match this repo: uv-managed Python deps (pyproject.toml + uv.lock)
# and the pinned actions in .github/workflows/release.yml.
# Commit prefixes (build / ci) map to cliff.toml's "^build|^ci" -> Build & CI section.
version: 2
updates:
  - package-ecosystem: "uv"
    directory: "/"
    schedule:
      interval: "weekly"
    commit-message:
      prefix: "build"
      include: "scope"
    open-pull-requests-limit: 5
    # Minor/patch bumps arrive as one grouped PR to cut solo-maintainer noise;
    # majors stay individual so breaking changes are reviewed on their own.
    groups:
      python-minor-patch:
        patterns: ["*"]
        update-types: ["minor", "patch"]
    # silica-core caps tree-sitter below 0.26 because 0.26.0 corrupts the heap
    # (its pyproject: ~900 files walked in one process segfault). Every weekly
    # run that tried the bump failed to resolve and exited 1 (2026-10-24, 10-27,
    # 10-31). Drop this entry in the commit that drops silica-core's ceiling.
    ignore:
      - dependency-name: "tree-sitter"
        versions: [">=0.26"]

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    commit-message:
      prefix: "ci"
      include: "scope"
    groups:
      actions:
        patterns: ["*"]
